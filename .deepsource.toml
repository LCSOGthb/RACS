version = 1

test_patterns = [
  "**/*.test.*",
  "**/*.spec.*"
]

exclude_patterns = [
  "node_modules/**",
  ".next/**",
  "dist/**",
  "build/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]

  environment = [
    "browser",
    "nodejs"
  ]

[[analyzers]]
name = "secrets"
enabled = true

[[code_formatters]]
name = "prettier"
enabled = true
