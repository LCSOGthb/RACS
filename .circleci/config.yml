version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Say Hello
          command: echo "Hello, World!"

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan "${CIRCLE_JOB}" \
              --environment-name="default" \
              --component-name="${CIRCLE_PROJECT_REPONAME}" \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - deploy:
          requires:
            - say-hello
